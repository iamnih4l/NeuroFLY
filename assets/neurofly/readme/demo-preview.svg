<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto">
  <defs>
    <style>
      @keyframes scan {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(400px); }
      }
      .play-icon {
        transition: transform 0.2s ease;
      }
      .play-btn:hover .play-icon {
        transform: scale(1.1);
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </defs>
  
  <rect width="800" height="400" fill="#010409"/>
  <rect width="800" height="400" fill="#161b22" opacity="0.5"/>
  
  <!-- Faux Video UI -->
  <rect x="50" y="40" width="700" height="320" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <!-- Grid -->
  <path d="M 50 120 L 750 120 M 50 200 L 750 200 M 50 280 L 750 280" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 225 40 L 225 360 M 400 40 L 400 360 M 575 40 L 575 360" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Neural Data lines representing the video feed -->
  <path d="M 50 200 Q 150 100 250 250 T 450 150 T 600 200 T 750 150" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 50 250 Q 200 350 350 200 T 550 250 T 750 200" stroke="#ff00ff" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Overlay text -->
  <text x="400" y="180" fill="#fff" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">DEMO VIDEO PLACEHOLDER</text>
  <text x="400" y="210" fill="#8b949e" font-family="monospace" font-size="14" text-anchor="middle">Video will be embedded here via GitHub Issue.</text>
  
  <!-- Play Button -->
  <g class="play-btn" transform="translate(400, 260)">
    <circle cx="0" cy="0" r="30" fill="#e74c3c" style="animation: blink 2s infinite;"/>
    <path class="play-icon" d="M -10 -15 L 15 0 L -10 15 Z" fill="#fff"/>
  </g>

  <!-- Scanline effect -->
  <rect width="800" height="20" fill="#00ffff" opacity="0.1" style="animation: scan 4s linear infinite; pointer-events: none;"/>
</svg>
