<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="auto">
  <defs>
    <style>
      .spike { stroke: #00ffff; stroke-width: 1.5; opacity: 0.8; }
      .spike-heavy { stroke: #ff00ff; stroke-width: 2; opacity: 0.9; }
      .grid { stroke: #30363d; stroke-width: 1; stroke-dasharray: 2 4; }
      .text-label { font-family: monospace; font-size: 10px; fill: #8b949e; }
      @keyframes sweep {
        0% { transform: translateX(0); }
        100% { transform: translateX(700px); }
      }
    </style>
  </defs>

  <rect width="800" height="250" fill="#010409" />
  
  <!-- Grid -->
  <path d="M 50 50 L 750 50 M 50 100 L 750 100 M 50 150 L 750 150 M 50 200 L 750 200" class="grid" />
  
  <!-- Y-Axis labels -->
  <text x="40" y="55" class="text-label" text-anchor="end">MBON-01</text>
  <text x="40" y="105" class="text-label" text-anchor="end">PPL1-01</text>
  <text x="40" y="155" class="text-label" text-anchor="end">PAM-01</text>
  <text x="40" y="205" class="text-label" text-anchor="end">KC-γ</text>

  <!-- Spikes -->
  <g class="spike">
    <line x1="80" y1="40" x2="80" y2="60" />
    <line x1="85" y1="40" x2="85" y2="60" />
    <line x1="150" y1="40" x2="150" y2="60" />
    <line x1="160" y1="40" x2="160" y2="60" />
    <line x1="163" y1="40" x2="163" y2="60" />
    <line x1="250" y1="40" x2="250" y2="60" />
    <line x1="255" y1="40" x2="255" y2="60" />
    <line x1="258" y1="40" x2="258" y2="60" />
    <line x1="262" y1="40" x2="262" y2="60" />
    <line x1="400" y1="40" x2="400" y2="60" />
    
    <line x1="120" y1="90" x2="120" y2="110" class="spike-heavy" />
    <line x1="125" y1="90" x2="125" y2="110" class="spike-heavy" />
    <line x1="300" y1="90" x2="300" y2="110" class="spike-heavy" />
    <line x1="310" y1="90" x2="310" y2="110" class="spike-heavy" />
    <line x1="600" y1="90" x2="600" y2="110" class="spike-heavy" />
    
    <line x1="90" y1="140" x2="90" y2="160" />
    <line x1="200" y1="140" x2="200" y2="160" />
    <line x1="205" y1="140" x2="205" y2="160" />
    <line x1="500" y1="140" x2="500" y2="160" />
    
    <line x1="70" y1="190" x2="70" y2="210" />
    <line x1="75" y1="190" x2="75" y2="210" />
    <line x1="140" y1="190" x2="140" y2="210" />
    <line x1="143" y1="190" x2="143" y2="210" />
    <line x1="240" y1="190" x2="240" y2="210" />
    <line x1="242" y1="190" x2="242" y2="210" />
    <line x1="245" y1="190" x2="245" y2="210" />
    <line x1="247" y1="190" x2="247" y2="210" />
  </g>
  
  <!-- Continuous adaptation curve -->
  <path d="M 50 180 Q 200 120 400 170 T 750 140" stroke="#e74c3c" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Overlay Text -->
  <rect x="50" y="220" width="700" height="20" fill="#010409" opacity="0.8" />
  <text x="400" y="234" class="text-label" text-anchor="middle">ILLUSTRATIVE COMPUTATIONAL SIGNAL — NOT BIOLOGICAL MEASUREMENT</text>

  <!-- Sweeping scanline -->
  <rect x="50" y="40" width="2" height="170" fill="#00ffff" opacity="0.5" style="animation: sweep 4s linear infinite;" />
</svg>
